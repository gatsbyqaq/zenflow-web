name: ZenFlow
options:
  bundleIdPrefix: com.gatsbyqaq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.46.0
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "47"
  CURRENT_PROJECT_VERSION: "47"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ZenFlow:
    type: application
    platform: iOS
    sources:
      - path: ZenFlow
        excludes:
          - Info.plist
      - path: ZenFlowCore/Sources/ZenFlowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gatsbyqaq.zenflow
        PRODUCT_NAME: ZenFlow
        INFOPLIST_FILE: ZenFlow/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "47"
        CURRENT_PROJECT_VERSION: "47"
    dependencies:
      - package: Supabase
        product: Supabase
  ZenFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZenFlowUITests
    dependencies:
      - target: ZenFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gatsbyqaq.zenflow.uitests
        TEST_TARGET_NAME: ZenFlow
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "47"
        CURRENT_PROJECT_VERSION: "47"
schemes:
  ZenFlow:
    build:
      targets:
        ZenFlow: all
        ZenFlowUITests: [test]
    run:
      config: Debug
    test:
      targets:
        - ZenFlowUITests
